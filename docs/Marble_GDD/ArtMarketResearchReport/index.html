    function renderTable(data) {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        data.forEach(game => {
            const row = `<tr>
                <td><a href="${game.url}" target="_blank" class="game-name-link">${game.name}</a></td>
                <td style="font-weight: 600; color: #fca5a5;">${game.sales.toLocaleString()}+</td>
                <td style="font-weight: 600; color: #fde047;">${game.positive.toLocaleString()}+</td>
                <td><span class="badge">${game.year}</span></td>
                <td class="worldview">${game.worldview}</td>
                <td style="font-weight: 700; color: #4ade80;">${game.price === 0 ? "FREE" : "$" + game.price}</td>
                <td>
                    <a href="${game.url}" target="_blank" class="steam-link">前往 Steam 頁面</a>
                </td>
            </tr>`;
            body.innerHTML += row;
        });
    }

    let sortOrder = {};
    function sortTable(columnIndex) {
        const keys = ['name', 'sales', 'positive', 'year', 'worldview', 'price'];
        const key = keys[columnIndex];
        
        if (!sortOrder[key]) sortOrder[key] = 'asc';
        else sortOrder[key] = sortOrder[key] === 'asc' ? 'desc' : 'asc';

        const headers = document.querySelectorAll('th');
        headers.forEach((th, i) => {
            th.classList.remove('sort-asc', 'sort-desc');
            if (i === columnIndex) {
                th.classList.add(sortOrder[key] === 'asc' ? 'sort-asc' : 'sort-desc');
            }
        });

        gameData.sort((a, b) => {
            let valA = a[key];
            let valB = b[key];
            if (typeof valA === 'string') {
                return sortOrder[key] === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
                return sortOrder[key] === 'asc' ? valA - valB : valB - valA;
            }
        });
        renderTable(gameData);
    }

    function filterTable() {
        const input = document.getElementById('gameSearch');
        const filter = input.value.toUpperCase();
        const filteredData = gameData.filter(game => 
            game.name.toUpperCase().includes(filter) || 
            game.worldview.toUpperCase().includes(filter)
        );
        renderTable(filteredData);
    }

    renderTable(gameData);
